<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Kalam', 'Comic Sans MS', 'Segoe UI', sans-serif;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');
      .box { stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .title { font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtext { font-size: 14px; fill: #34495e; }
      .arrow { stroke-width: 2.5; stroke-linecap: round; fill: none; }
      .badge { font-size: 12px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad" />
    </marker>
  </defs>

  <!-- 1. SQL Server OLTP -->
  <rect x="30" y="50" width="220" height="250" rx="14" ry="14" class="box" fill="#fff3bf" stroke="#e67e22" stroke-dasharray="0" />
  <text x="50" y="85" class="title" fill="#d35400">🗄️ SQL Server (OLTP)</text>
  <text x="50" y="110" class="subtext" fill="#7f8c8d">Schema: e_commerce</text>
  <line x1="45" y1="122" x2="235" y2="122" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="50" y="135" width="180" height="32" rx="6" fill="#ffffff" stroke="#f39c12" />
  <text x="65" y="156" class="subtext">📋 e_commerce.customer</text>
  <rect x="50" y="175" width="180" height="32" rx="6" fill="#ffffff" stroke="#f39c12" />
  <text x="65" y="196" class="subtext">📋 e_commerce.ecom_sales</text>
  <rect x="50" y="215" width="180" height="32" rx="6" fill="#ffffff" stroke="#f39c12" />
  <text x="65" y="236" class="subtext">📋 e_commerce.product</text>
  <rect x="50" y="255" width="180" height="32" rx="6" fill="#ffffff" stroke="#f39c12" />
  <text x="65" y="276" class="subtext">📋 e_commerce.region</text>

  <!-- Arrow 1 -->
  <path d="M 250 175 Q 275 170 300 175" class="arrow" stroke="#2980b9" marker-end="url(#arrowhead)" />
  <text x="252" y="160" class="badge" fill="#2980b9">pymssql</text>

  <!-- 2. DLT Ingestion -->
  <rect x="305" y="90" width="220" height="170" rx="14" ry="14" class="box" fill="#e0f7fa" stroke="#00acc1" />
  <text x="320" y="125" class="title" fill="#00838f">⚡ DLT Ingestion Engine</text>
  <text x="320" y="148" class="subtext" fill="#006064">ingestion/dlt_pipeline.py</text>
  <line x1="315" y1="160" x2="515" y2="160" stroke="#00acc1" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="320" y="185" class="subtext">• Auto Schema Detection</text>
  <text x="320" y="210" class="subtext">• Write disposition: replace</text>
  <text x="320" y="235" class="subtext">• Syncs to xom_ecom dataset</text>

  <!-- Arrow 2 -->
  <path d="M 525 175 Q 550 170 575 175" class="arrow" stroke="#27ae60" marker-end="url(#arrowhead-green)" />
  <text x="530" y="160" class="badge" fill="#27ae60">DuckDB API</text>

  <!-- 3. DuckDB Warehouse -->
  <rect x="580" y="40" width="310" height="270" rx="14" ry="14" class="box" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="600" y="75" class="title" fill="#1b5e20">🦆 DuckDB Warehouse &amp; dbt</text>
  <text x="600" y="98" class="subtext" fill="#388e3c">data/warehouse.duckdb</text>
  <line x1="595" y1="108" x2="875" y2="108" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <rect x="600" y="120" width="270" height="40" rx="8" fill="#c8e6c9" stroke="#4caf50" />
  <text x="615" y="145" class="subtext" font-weight="bold">🥉 Bronze Layer (Raw xom_ecom)</text>

  <rect x="600" y="170" width="270" height="40" rx="8" fill="#a5d6a7" stroke="#388e3c" />
  <text x="615" y="195" class="subtext" font-weight="bold">🥈 Silver Layer (Cleaned &amp; Joined)</text>

  <rect x="600" y="220" width="270" height="70" rx="8" fill="#81c784" stroke="#1b5e20" />
  <text x="615" y="245" class="subtext" font-weight="bold">🥇 Gold Layer (15 Business Models)</text>
  <text x="615" y="270" class="subtext" font-size="12">RFM, Revenue, YoY Growth, Market Basket</text>

  <!-- 4. Orchestration -->
  <rect x="305" y="330" width="585" height="110" rx="14" ry="14" class="box" fill="#f3e5f5" stroke="#7b1fa2" />
  <text x="325" y="365" class="title" fill="#4a148c">⚙️ Orchestration &amp; Cloud Audit Logging</text>
  <text x="325" y="388" class="subtext">orchestration/orchestrator.py ➔ orchestration/cosmos_orchestrator.py</text>
  <line x1="320" y1="398" x2="875" y2="398" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="325" y="422" class="subtext">🔄 Triggers Ingestion &amp; dbt Runs  |  ☁️ Logs Execution Status to Azure Cosmos DB</text>

  <!-- Flow connecting Orchestration -->
  <path d="M 415 330 L 415 265" class="arrow" stroke="#8e44ad" marker-end="url(#arrowhead-purple)" stroke-dasharray="4 4" />
  <path d="M 735 330 L 735 315" class="arrow" stroke="#8e44ad" marker-end="url(#arrowhead-purple)" stroke-dasharray="4 4" />
</svg>