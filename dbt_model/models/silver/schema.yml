version: 2

models:
  - name: silver_customer
    description: "Silver Layer: Cleaned, type-casted, and standardized customer dimension table. Combines first and last name into full_name and validates birth dates."
    columns:
      - name: customer_id
        description: "Primary key for customer entity."
        tests:
          - unique
          - not_null
      - name: full_name
        description: "Concatenated first and last name of customer."
      - name: email_address
        description: "Validated customer contact email address."
      - name: occupation
        description: "Customer occupation/job title."
      - name: education_level
        description: "Customer highest education level attained."
      - name: marital_status
        description: "Customer marital status code."
      - name: gender
        description: "Customer gender identifier."

  - name: silver_ecom_sales
    description: "Silver Layer: Cleaned sales transactions fact table. Type-casts numeric revenue, profit, discount rates, and order timestamps."
    columns:
      - name: order_id
        description: "Primary key for sales transaction line."
        tests:
          - not_null
      - name: customer_id
        description: "Foreign key linking transaction to silver_customer."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key linking transaction to silver_product."
      - name: order_date
        description: "Normalized transaction date."
      - name: sales_amount
        description: "Total revenue amount generated by order."
      - name: profit_amount
        description: "Net profit generated by order after costs."
      - name: discount_rate
        description: "Percentage discount applied to order (0.0 to 1.0)."

  - name: silver_product
    description: "Silver Layer: Cleaned product catalog dimension table with category and subcategory classifications."
    columns:
      - name: product_id
        description: "Primary key for product entity SKU."
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Standardized product commercial title."
      - name: category
        description: "Top-level product category (e.g. Office Supplies, Furniture, Technology)."
      - name: subcategory
        description: "Detailed subcategory classification."

  - name: silver_region
    description: "Silver Layer: Cleaned geographic region dimension table with standardized market taxonomy (US, EMEA, APAC, LATAM)."
    columns:
      - name: region_id
        description: "Primary key for region entity."
        tests:
          - not_null
      - name: country
        description: "Standardized country name."
      - name: market
        description: "Global business market (US, EMEA, APAC, LATAM)."
