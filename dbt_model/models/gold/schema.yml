version: 2

models:
  - name: total_revenue_profit
    description: "Gold Layer (Q1): High-level executive summary mart calculating total business revenue and net profit."
    columns:
      - name: total_revenue
        description: "Cumulative sum of revenue across all historical sales orders."
      - name: total_profit
        description: "Cumulative net profit across all historical sales orders."

  - name: revenue_by_segment
    description: "Gold Layer (Q2): Aggregated sales breakdown by customer segment (Consumer, Corporate, Home Office)."
    columns:
      - name: customer_segment
        description: "Customer business segment (Consumer, Corporate, Home Office)."
      - name: revenue
        description: "Total sales revenue for the segment."
      - name: profit
        description: "Total profit for the segment."

  - name: top_10_products
    description: "Gold Layer (Q3): Top 10 best-selling products ranked by total revenue."
    columns:
      - name: product_id
        description: "Unique product SKU identifier."
      - name: product_name
        description: "Product commercial title."
      - name: revenue
        description: "Total sales revenue generated by product."
      - name: profit
        description: "Total net profit generated by product."

  - name: customers_by_gender_occupation
    description: "Gold Layer (Q4): Customer demographic distribution grouped by gender and occupation."
    columns:
      - name: gender
        description: "Customer gender."
      - name: occupation
        description: "Customer professional occupation."
      - name: customer_count
        description: "Total count of unique customers in demographic group."

  - name: avg_discount_by_category
    description: "Gold Layer (Q5): Average discount rate applied across major product categories."
    columns:
      - name: category
        description: "Product category (Office Supplies, Furniture, Technology)."
      - name: avg_discount
        description: "Average discount rate applied (0.0 to 1.0)."

  - name: profit_margin_by_market
    description: "Gold Layer (Q6): Overall profit margin percentages across global markets (Europe, USCA, LATAM, Africa, Asia Pacific)."
    columns:
      - name: market
        description: "Global business market region."
      - name: profit_margin
        description: "Calculated profit margin ratio (Total Profit / Total Revenue)."

  - name: loss_orders_by_segment
    description: "Gold Layer (Q7): Unprofitable sales order counts and total loss amounts grouped by customer segment."
    columns:
      - name: customer_segment
        description: "Customer segment experiencing loss orders."
      - name: loss_order_count
        description: "Count of orders where profit is less than zero."
      - name: total_loss_amount
        description: "Cumulative net negative profit total."

  - name: vip_churn_risk
    description: "Gold Layer (Q8): High-value VIP customers who have not placed an order in over 180 days (churn risk)."
    columns:
      - name: customer_id
        description: "VIP customer unique identifier."
      - name: full_name
        description: "Customer full name."
      - name: total_spent
        description: "Historical total spending amount."
      - name: days_since_last_order
        description: "Elapsed days since customer's most recent order."

  - name: cross_sell_consumer_corporate
    description: "Gold Layer (Q9): Category purchase cross-sell distribution comparing Consumer vs Corporate segments."
    columns:
      - name: category
        description: "Product category."
      - name: consumer_revenue
        description: "Total revenue contributed by Consumer segment."
      - name: corporate_revenue
        description: "Total revenue contributed by Corporate segment."

  - name: top_15_countries_by_revenue
    description: "Gold Layer (Q10): Top 15 country markets ranked by total revenue contribution."
    columns:
      - name: country_name
        description: "Country geographic name."
      - name: market
        description: "Parent global market region."
      - name: revenue
        description: "Total revenue generated in country."

  - name: monthly_revenue_yoy
    description: "Gold Layer (Q11): Monthly revenue aggregation with Year-over-Year (YoY) and Month-over-Month (MoM) growth calculations."
    columns:
      - name: year_month
        description: "Formatted year and month (YYYY-MM)."
      - name: revenue
        description: "Total monthly sales revenue."
      - name: previous_month_revenue
        description: "Revenue from preceding month using window LAG function."
      - name: mom_growth_pct
        description: "Percentage growth rate compared to previous month."

  - name: top_3_profit_products_by_category
    description: "Gold Layer (Q12): Top 3 highest profit margin products within each product category."
    columns:
      - name: category
        description: "Product category."
      - name: product_name
        description: "Product title."
      - name: profit_rank
        description: "Rank position (1, 2, 3) within category."

  - name: cross_market_customers
    description: "Gold Layer (Q13): Customers who have purchased products across multiple global markets."
    columns:
      - name: customer_id
        description: "Customer unique identifier."
      - name: market_count
        description: "Distinct count of global markets purchased from."

  - name: customer_rfm_segments
    description: "Gold Layer (Q14): Customer Segmentation based on Recency, Frequency, and Monetary (RFM) analysis."
    columns:
      - name: customer_id
        description: "Customer unique identifier."
      - name: r_score
        description: "Recency score (1-5)."
      - name: f_score
        description: "Frequency score (1-5)."
      - name: m_score
        description: "Monetary score (1-5)."
      - name: rfm_segment
        description: "Assigned customer persona (e.g. Champions, Loyal Customers, At Risk, Hibernating)."

  - name: market_basket_products
    description: "Gold Layer (Q15): Frequently co-purchased product pairs for Market Basket Analysis."
    columns:
      - name: product_a
        description: "First product title in pair."
      - name: product_b
        description: "Second product title in pair."
      - name: co_purchase_count
        description: "Number of orders containing both products."
